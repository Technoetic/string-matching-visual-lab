name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # @MX:NOTE Vite 8(Rolldown)의 플랫폼별 네이티브 바이너리는 Windows에서 생성된 lockfile에
      # 빠져 있어 `npm ci`(엄격)가 Linux에서 실패한다. `npm install`로 플랫폼 optional 의존성을 받는다.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run unit tests
        run: npm run test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
